<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="hsl(265 85% 64%)"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="hsl(35 85% 64%)"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="hsl(165 85% 64%)"/>
    </marker>
    <marker id="arrowNeutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#eef1f7"/>
    </marker>
    <linearGradient id="mergeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="hsl(265 85% 64%)"/>
      <stop offset="50%" stop-color="hsl(35 85% 64%)"/>
      <stop offset="100%" stop-color="hsl(165 85% 64%)"/>
    </linearGradient>
  </defs>

  <!-- ===== Source 1: Prompt Engineering ===== -->
  <rect x="20" y="20" width="340" height="150" rx="16" fill="rgba(255,255,255,.045)" stroke="hsl(265 85% 64% / .55)" stroke-width="1.5"/>
  <circle cx="52" cy="52" r="14" fill="none" stroke="hsl(265 85% 64%)" stroke-width="1.5"/>
  <text x="52" y="57" font-size="13" font-weight="700" fill="hsl(265 85% 64%)" text-anchor="middle">1</text>
  <text x="76" y="48" font-size="11" letter-spacing="1.5" fill="#6b7384">ISTRUZIONI DI BASE</text>
  <text x="44" y="86" font-size="21" font-weight="700" fill="#eef1f7">Prompt Engineering</text>
  <text x="44" y="116" font-size="14" fill="#97a0b3">Ruolo, obiettivo, tono e</text>
  <text x="44" y="137" font-size="14" fill="#97a0b3">guardrail del modello.</text>

  <!-- ===== Source 2: RAG ===== -->
  <rect x="20" y="195" width="340" height="150" rx="16" fill="rgba(255,255,255,.045)" stroke="hsl(35 85% 64% / .55)" stroke-width="1.5"/>
  <circle cx="52" cy="227" r="14" fill="none" stroke="hsl(35 85% 64%)" stroke-width="1.5"/>
  <text x="52" y="232" font-size="13" font-weight="700" fill="hsl(35 85% 64%)" text-anchor="middle">2</text>
  <text x="76" y="223" font-size="11" letter-spacing="1.5" fill="#6b7384">CONOSCENZA STATICA</text>
  <text x="44" y="261" font-size="21" font-weight="700" fill="#eef1f7">RAG</text>
  <text x="44" y="291" font-size="14" fill="#97a0b3">Frammenti recuperati dalla</text>
  <text x="44" y="312" font-size="14" fill="#97a0b3">Knowledge Base documentale.</text>

  <!-- ===== Source 3: Context Engineering ===== -->
  <rect x="20" y="370" width="340" height="150" rx="16" fill="rgba(255,255,255,.045)" stroke="hsl(165 85% 64% / .55)" stroke-width="1.5"/>
  <circle cx="52" cy="402" r="14" fill="none" stroke="hsl(165 85% 64%)" stroke-width="1.5"/>
  <text x="52" y="407" font-size="13" font-weight="700" fill="hsl(165 85% 64%)" text-anchor="middle">3</text>
  <text x="76" y="398" font-size="11" letter-spacing="1.5" fill="#6b7384">DATI LIVE</text>
  <text x="44" y="436" font-size="21" font-weight="700" fill="#eef1f7">Context Engineering</text>
  <text x="44" y="466" font-size="14" fill="#97a0b3">Dati in tempo reale dai sistemi</text>
  <text x="44" y="487" font-size="14" fill="#97a0b3">del cliente, via MCP / tool.</text>

  <!-- ===== Converging arrows into the merge box ===== -->
  <path d="M360,52 C395,52 395,270 430,270" fill="none" stroke="hsl(265 85% 64%)" stroke-width="2.5" opacity=".85" marker-end="url(#arrowPurple)"/>
  <path d="M360,270 L430,270" fill="none" stroke="hsl(35 85% 64%)" stroke-width="2.5" opacity=".85" marker-end="url(#arrowGold)"/>
  <path d="M360,445 C395,445 395,270 430,270" fill="none" stroke="hsl(165 85% 64%)" stroke-width="2.5" opacity=".85" marker-end="url(#arrowTeal)"/>

  <!-- ===== Merge box: the integrated prompt ===== -->
  <rect x="430" y="185" width="430" height="170" rx="18" fill="rgba(255,255,255,.05)" stroke="url(#mergeGrad)" stroke-width="2"/>
  <text x="645" y="223" font-size="12" letter-spacing="2" fill="#97a0b3" text-anchor="middle">SI COMBINANO NEL</text>
  <text x="645" y="258" font-size="25" font-weight="700" fill="#eef1f7" text-anchor="middle">Il Prompt dell'Agente</text>
  <text x="645" y="289" font-size="14.5" fill="#97a0b3" text-anchor="middle">Istruzioni + conoscenza (RAG) +</text>
  <text x="645" y="310" font-size="14.5" fill="#97a0b3" text-anchor="middle">dati live, assemblati ad ogni richiesta.</text>

  <!-- ===== Arrow: merge -> agent ===== -->
  <path d="M860,270 L900,270" fill="none" stroke="#eef1f7" stroke-width="2.5" opacity=".7" marker-end="url(#arrowNeutral)"/>

  <!-- ===== Agent box ===== -->
  <rect x="900" y="200" width="320" height="140" rx="18" fill="hsl(265 85% 64% / .12)" stroke="hsl(265 85% 64%)" stroke-width="2"/>
  <text x="1060" y="226" font-size="12" letter-spacing="2" fill="#97a0b3" text-anchor="middle">ESEGUITO DA</text>
  <text x="1060" y="260" font-size="23" font-weight="700" fill="#eef1f7" text-anchor="middle">Agente AI (LLM)</text>
  <text x="1060" y="290" font-size="14" fill="#97a0b3" text-anchor="middle">Risponde, richiama tool/MCP,</text>
  <text x="1060" y="309" font-size="14" fill="#97a0b3" text-anchor="middle">agisce sui sistemi.</text>

  <!-- ===== Arrow: agent -> output ===== -->
  <path d="M1220,270 L1280,270" fill="none" stroke="#eef1f7" stroke-width="2.5" opacity=".7" marker-end="url(#arrowNeutral)"/>

  <!-- ===== Output box ===== -->
  <rect x="1280" y="215" width="380" height="110" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.16)" stroke-width="1.5"/>
  <text x="1470" y="252" font-size="17" font-weight="600" fill="#eef1f7" text-anchor="middle">Risposta al cliente</text>
  <text x="1470" y="273" font-size="17" font-weight="600" fill="#eef1f7" text-anchor="middle">o azione nei sistemi</text>
  <text x="1470" y="297" font-size="12.5" fill="#6b7384" text-anchor="middle">CRM · gestionali · e-commerce</text>
</svg>
